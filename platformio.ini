; CrowPanel 1.28" HMI ESP32 Rotary Display (240x240 IPS redondo, touch + knob)
; ESP32-S3R8 : 16MB flash (quad) + 8MB PSRAM (octal)

[common]
platform = espressif32 @ ^6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; --- flash 16MB / PSRAM octal ---------------------------------------------
board_upload.flash_size    = 16MB
board_upload.maximum_size  = 16777216
board_build.arduino.memory_type = qio_opi
board_build.partitions     = default_16MB.csv

upload_speed  = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    ; Serial vai pelo USB-Serial/JTAG nativo do S3 (nao ha chip UART externo)
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D BOARD_HAS_PSRAM
    ; LVGL le o lv_conf.h que esta em include/
    -D LV_CONF_INCLUDE_SIMPLE
    -I include
    -D LV_LVGL_H_INCLUDE_SIMPLE

lib_deps =
    lvgl/lvgl @ ^8.3.11
    moononournation/GFX Library for Arduino @ ~1.3.9   ; 1.4+ exige Arduino-ESP32 core 3.x
    adafruit/Adafruit NeoPixel @ ^1.12.3
    https://github.com/fbiego/CST816S.git

; --- aplicacao -------------------------------------------------------------
[env:crowpanel_128_rotary]
extends = common
build_src_filter = +<*> -<diag.cpp>

; --- diagnostico sem LVGL (backlight + painel em cru) ----------------------
[env:diag]
extends = common
build_src_filter = +<diag.cpp>
